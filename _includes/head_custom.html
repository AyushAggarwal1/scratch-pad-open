<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,wght@1,500&display=swap">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<meta name="theme-color" content="#faf9f6">
<script src="{{ '/assets/js/notebook.js' | relative_url }}" defer></script>
<noscript><style>.site-nav { display: block; } #menu-button, .search, .js-scheme-toggle { display: none; }</style></noscript>
<script>
  // Restore the theme before paint, including the previous notebook preference.
  (function () {
    var pref;
    try { pref = localStorage.getItem('osn-scheme'); } catch (e) {}
    if (pref !== 'light' && pref !== 'dark') {
      pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    if (pref === 'dark') {
      var link = document.querySelector('link[href*="just-the-docs-default.css"]');
      if (link) link.href = link.href.replace('just-the-docs-default.css', 'just-the-docs-scratchpad-dark.css');
      document.querySelector('meta[name="theme-color"]').content = '#181a19';
    }
  })();
</script>
